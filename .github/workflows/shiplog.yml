# shipped/1 — what this repository shipped, derived from its own history.
#
# The log is a generated artifact, like a lockfile: it is regenerated here and
# committed, never hand-edited. `paths-ignore` covers the files this workflow
# writes, so the commit it makes does not trigger it again.
#
# The served copy is the PUBLIC PROJECTION and is written by the emitter, not
# copied by a step here — a copy step can be forgotten, and forgetting it would
# publish private entries at a URL.
#
# Everything lands `private`. Changing that is one field in
# .shiplog/config.json, and it is the decision that publishes this repository's
# shipping to anyone who asks.
name: Shiplog

on:
  push:
    paths-ignore:
      - 'shiplog.fragment.json'
      - 'public/.well-known/shiplog.json'
  schedule:
    # Daily, so a log stays current even in a quiet week — and so a repository
    # that stops shipping says so by standing still rather than by going stale.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shiplog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the log is derived from it. A shallow
          # clone silently produces a log that starts at the last twenty commits.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Emit
        run: node vendor-shiplog.mjs emit

      # The one check nobody else can do: every digest recomputed from the
      # entry it claims to cover.
      - name: Re-verify every seal
        run: node vendor-shiplog.mjs verify shiplog.fragment.json

      # The head must be rebuilt in the same run that rebuilt the fragment, or
      # it commits to a tree that no longer exists. Emitting it from its own
      # workflow would leave a window — however short — in which the published
      # root and the published record disagree, and a reader hitting that
      # window sees a forged-looking estate.
      - name: Refresh the checkpoint over the new log
        if: hashFiles('vendor-checkpoint.mjs') != ''
        run: |
          node vendor-checkpoint.mjs emit
          node vendor-checkpoint.mjs verify

      # The push can be rejected when main moves under the run — flashyos's
      # copy of this workflow failed three runs straight that way. Rebase is
      # the wrong retry for a derived artifact — the log derives from the
      # very history that just moved — so a rejection means regenerate on
      # the new tip and push that.
      - name: Commit if it changed
        id: commit
        # A pull_request checkout is a detached merge ref, so this step can only
        # fail there: the push is rejected, the retry below reads that as "the
        # branch moved", resets to origin/<default> and burns five attempts.
        #
        # Measured on shipping refs 2026-09-02: thirty workflows in the estate
        # both push and trigger on pull_request, one of them guarded. Real runs
        # rather than inference — gold-holdings 4 of 4 failures, flashy-ledger
        # 3 of 3, back to 30 August, dependabot's updates among them.
        #
        # It is gated here rather than on the job because the rest of the job is
        # worth running on a PR: emit and check still validate, and nothing
        # pushes. adopt.ts promised exactly that in a comment for weeks while
        # the file did the opposite.
        if: github.event_name != 'pull_request'
        run: |
          # The branch is read per run. A literal here is the trap eleven
          # repositories in this estate are already sitting in: their default
          # is an agent branch, and a retry that resets to a hardcoded main
          # would push one branch's content over another's.
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "shiplog"
          git config user.email "shiplog@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git diff --quiet; then
              echo "no change"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add -A
            git commit -m "shipped/1: refresh the log, and the checkpoint over it [skip ci]"
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — $BRANCH moved; regenerating on the new tip"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            node vendor-shiplog.mjs emit
            node vendor-shiplog.mjs verify shiplog.fragment.json
            if [ -f vendor-checkpoint.mjs ]; then
              node vendor-checkpoint.mjs emit
              node vendor-checkpoint.mjs verify
            fi
          done
          echo "$BRANCH outran five attempts; the next push's run will refresh this"
          exit 1

      # ── Tell the estate, so the graph does not wait for tomorrow ─────────────
      #
      # The merge in flashyos fetches every property's fragment over the network
      # on a daily schedule. Without this a change here is invisible for up to
      # 24 hours, and "the graph is a day behind" is indistinguishable from
      # "this property has nothing new to say".
      #
      # Gated on the commit step having actually PUSHED. A dispatch per run
      # rather than per change turns one daily merge into a merge per push
      # across thirty repositories.
      #
      # Loud when the secret is missing, because a skipped step reports the run
      # green — which is how flashy-academy pushed 34 times in five days and
      # deployed zero.
      - name: Notify the estate graph
        if: steps.commit.outputs.pushed == 'true'
        env:
          TOKEN: ${{ secrets.ESTATE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Fan-out is not configured::The record changed and the estate graph was not told. The daily merge still finds it, so this is a delay of up to 24 hours rather than a loss. Set ESTATE_DISPATCH_TOKEN (an org secret with contents:write on FlashyLabs/flashyos) to close it."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/FlashyLabs/flashyos/dispatches -d '{"event_type":"estate-fragment-updated"}')
          if [ "$code" != "204" ]; then
            echo "::error title=Fan-out failed::flashyos returned $code to the dispatch. The daily merge is the fallback."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "::notice::Estate graph notified."
      