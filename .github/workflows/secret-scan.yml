# Secret scanning, through the workflow flashy-infra publishes.
#
# One file, calling one shared definition, so a change to the scan reaches every
# repository on its next run rather than needing 30 pull requests. Before this,
# ten of thirty-five repositories had a scan and each carried its own private
# copy — which is what a shared template nobody consumes produces.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    uses: AgenteLabs/flashy-infra/.github/workflows/secret-scan-reusable.yml@main
